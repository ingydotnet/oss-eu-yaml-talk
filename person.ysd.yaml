name: +Str 3-30
  ~"{upper}{lower}+ {upper}{lower}+"
age: +Int 0..120
married?: +Bool =false
address: +address
phone: +Str[$1-3]
  ~"{plus}1-{digit}{3}-{digit}{3}-{digit}{4}"
attributes?:
  strength: +Num 0..10
  dexterity: +Num 0..10
  wisdom: +Num 0..10

+address:
  street: +Str
    ~"({digit}+ )?{upper}{lower}+(
    {upper}{lower}+)*
    (St|Ave|Blvd|Rd|Ln|Dr)\.?"
  city: +Str
    ~"{upper}{lower}+( {upper}{lower}+)*"
  state: +Str ~"{upper}{2}"
  postal code: +Str
    ~"{digit}{5}(-{digit}{4})?"

